name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # --- Payload generation ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate payload.txt
        working-directory: PicoSwitch
        run: |
          npm install
          node compress.js

      - name: Verify Luckfox transport and Pico macro parity
        run: |
          python3 -B -m unittest discover -s LuckfoxSwitch -p 'test_*.py' -v
          python3 -m py_compile LuckfoxSwitch/make_boot_env.py LuckfoxSwitch/make_sd_swap_assets.py
          bash -n LuckfoxSwitch/usb-gadget-hid.sh LuckfoxSwitch/install.sh LuckfoxSwitch/restore-default-gadget.sh LuckfoxSwitch/run-on-boot.sh
          sh -n LuckfoxSwitch/S99zz-civswitch LuckfoxSwitch/civswitchctl LuckfoxSwitch/luckfox-ssh-connect

      # --- Pico SDK ---
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Clone Pico SDK
        run: |
          git clone --branch 2.3.1 --depth 1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk

      # --- Build firmware ---
      - name: Fix script permissions
        run: chmod +x PicoSwitch/tools/*.py

      - name: Build pico2 (RP2350)
        working-directory: PicoSwitch
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          cmake --preset pico2
          cmake --build --preset pico2

      - name: Build pico1 (RP2040)
        working-directory: PicoSwitch
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          cmake --preset pico1
          cmake --build --preset pico1

      # --- Package LuckfoxSwitch ---
      - name: Package LuckfoxSwitch
        run: |
          cp PicoSwitch/payload.txt LuckfoxSwitch/payload.txt
          tar czf LuckfoxSwitch.tar.gz -C LuckfoxSwitch .
          cd LuckfoxSwitch && zip -r ../LuckfoxSwitch.zip . && cd ..
          python3 LuckfoxSwitch/make_sd_swap_assets.py --output-dir /tmp/civswap-assets
          tar czf CIVSWAP-assets.tar.gz -C /tmp/civswap-assets .

      # --- Upload artifacts (available on every run) ---
      - uses: actions/upload-artifact@v4
        with:
          name: civ7-pico2.uf2
          path: PicoSwitch/build-pico2/src/civ7-pico2.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: civ7-pico1.uf2
          path: PicoSwitch/build-pico1/src/civ7-pico1.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: LuckfoxSwitch
          path: LuckfoxSwitch.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: CIVSWAP-assets
          path: CIVSWAP-assets.tar.gz

      # --- Create GitHub Release on tag push ---
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PicoSwitch/build-pico2/src/civ7-pico2.uf2
            PicoSwitch/build-pico1/src/civ7-pico1.uf2
            LuckfoxSwitch.tar.gz
            LuckfoxSwitch.zip
            CIVSWAP-assets.tar.gz
