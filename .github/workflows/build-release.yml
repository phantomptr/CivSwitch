name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # --- Payload generation ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate payload.txt
        working-directory: PicoSwitch
        run: |
          npm install
          node compress.js

      # --- Pico SDK ---
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Clone Pico SDK
        run: |
          git clone --branch 2.3.1 --depth 1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk

      # --- Build firmware ---
      - name: Build pico2 (RP2350)
        working-directory: PicoSwitch
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          cmake --preset pico2
          cmake --build --preset pico2

      - name: Build pico1 (RP2040)
        working-directory: PicoSwitch
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          cmake --preset pico1
          cmake --build --preset pico1

      # --- Package LuckfoxSwitch ---
      - name: Package LuckfoxSwitch
        run: |
          cp PicoSwitch/payload.txt LuckfoxSwitch/payload.txt
          tar czf LuckfoxSwitch.tar.gz -C LuckfoxSwitch .
          cd LuckfoxSwitch && zip -r ../LuckfoxSwitch.zip . && cd ..

      # --- Upload artifacts (available on every run) ---
      - uses: actions/upload-artifact@v4
        with:
          name: civ7-pico2.uf2
          path: PicoSwitch/build-pico2/src/civ7-pico2.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: civ7-pico1.uf2
          path: PicoSwitch/build-pico1/src/civ7-pico1.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: LuckfoxSwitch
          path: LuckfoxSwitch.tar.gz

      # --- Create GitHub Release on tag push ---
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PicoSwitch/build-pico2/src/civ7-pico2.uf2
            PicoSwitch/build-pico1/src/civ7-pico1.uf2
            LuckfoxSwitch.tar.gz
            LuckfoxSwitch.zip
